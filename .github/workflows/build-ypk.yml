name: Build U.A. Startup YPK

on:
  push:
    paths:
      - "tools/build_ypk.py"
      - ".github/workflows/build-ypk.yml"
      - "script/c210000001.lua"
      - "test-strings.conf"
      - "pack/U.A. Startup Demo.ydk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ua-startup-ypk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - run: python tools/build_ypk.py
      - name: Commit generated YPK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/UA_Startup.ypk
          if git diff --cached --quiet; then
            echo "No generated pack changes."
          else
            git commit -m "Build U.A. Startup YPK package"
            git push
          fi
      - name: Upload YPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UA_Startup
          path: dist/UA_Startup.ypk
          if-no-files-found: error
          retention-days: 30
